services:
  db:
    image: mariadb:11
    container_name: tortoise-wow-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: mangos
      MYSQL_PASSWORD: mangos
      # Databases are typically created by the DB import scripts,
      # so we don't set MYSQL_DATABASE here
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/mysql/init:/docker-entrypoint-initdb.d:ro   # Grant permission
    networks:
      - tortoise-wow-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  realmd:
    image: ghcr.io/faemwow/tortoise-wow-realmd:latest
    container_name: tortoise-wow-realmd
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./data/etc/realmd.conf:/tortoise/realmd.conf:ro
      - ./data/patches:/tortoise/patches:ro
    ports:
      - "3724:3724"
    networks:
      - tortoise-wow-net 

  mangosd:
    image: ghcr.io/faemwow/tortoise-wow-mangosd:latest
    container_name: tortoise-wow-mangosd
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/etc/mangosd.conf:/tortoise/mangosd.conf:ro
      - ./data/dbc:/tortoise/dbc:ro
      - ./data/maps:/tortoise/maps:ro
      - ./data/vmaps:/tortoise/vmaps:ro
      - ./data/mmaps:/tortoise/mmaps:ro
    ports:
      - "8091:8091"
    networks:
      - tortoise-wow-net
    stdin_open: true   
    tty: true

networks:
  tortoise-wow-net:
    driver: bridge

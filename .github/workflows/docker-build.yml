name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    outputs:
      realmd-digest: ${{ steps.load.outputs.realmd-digest }}
      mangosd-digest: ${{ steps.load.outputs.mangosd-digest }}
      db-digest: ${{ steps.load.outputs.db-digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: tortoise-wow 
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Docker images with Nix
        run: |
          nix build .#realmd-image-tar .#mangosd-image-tar .#db-image-tar

      - name: Load images into Docker and capture digests
        id: load
        run: |
          docker load < result-realmd-image-tar
          docker load < result-mangosd-image-tar
          docker load < result-db-image-tar

          echo "realmd-digest=$(docker inspect --format='{{index .Id}}' tortoise-wow-realmd:latest)" >> $GITHUB_OUTPUT
          echo "mangosd-digest=$(docker inspect --format='{{index .Id}}' tortoise-wow-mangosd:latest)" >> $GITHUB_OUTPUT
          echo "db-digest=$(docker inspect --format='{{index .Id}}' tortoise-wow-db:latest)" >> $GITHUB_OUTPUT

      - name: Verify images are loaded
        run: |
          docker image inspect tortoise-wow-realmd:latest
          docker image inspect tortoise-wow-mangosd:latest
          docker image inspect tortoise-wow-db:latest

      - name: Export images as tarballs for artifact sharing
        run: |
          docker save tortoise-wow-realmd:latest | gzip > realmd.tar.gz
          docker save tortoise-wow-mangosd:latest | gzip > mangosd.tar.gz
          docker save tortoise-wow-db:latest | gzip > db.tar.gz

      - name: Upload image artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-images
          path: |
            realmd.tar.gz
            mangosd.tar.gz
            db.tar.gz
          retention-days: 1

  publish:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    permissions:
      packages: write
      id-token: write

    outputs:
      realmd-ref: ${{ steps.push.outputs.realmd-ref }}
      mangosd-ref: ${{ steps.push.outputs.mangosd-ref }}
      db-ref: ${{ steps.push.outputs.db-ref }}

    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: docker-images

      - name: Load images
        run: |
          docker load < realmd.tar.gz
          docker load < mangosd.tar.gz
          docker load < db.tar.gz

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for realmd
        id: meta-realmd
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a420667bea5 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-realmd
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long

      - name: Extract metadata for mangosd
        id: meta-mangosd
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a420667bea5 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mangosd
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long

      - name: Extract metadata for db
        id: meta-db
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a420667bea5 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-db
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long

      - name: Tag and push all images
        id: push
        run: |
          push_image() {
            local local_tag=$1
            local tags=$2
            local output_key=$3
            local digest=""
            for tag in $tags; do
              docker tag $local_tag $tag
              docker push $tag
            done
            # Capture digest from the registry (consistent across all tags)
            digest=$(docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${output_key}:sha-${{ github.sha }} --verbose 2>/dev/null | jq -r '.Descriptor.digest' || docker inspect --format='{{index .RepoDigests 0}}' $local_tag | cut -d@ -f2)
            echo "${output_key}-ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${output_key}@${digest}" >> $GITHUB_OUTPUT
          }
          push_image tortoise-wow-realmd:latest "${{ steps.meta-realmd.outputs.tags }}" realmd
          push_image tortoise-wow-mangosd:latest "${{ steps.meta-mangosd.outputs.tags }}" mangosd
          push_image tortoise-wow-db:latest "${{ steps.meta-db.outputs.tags }}" db

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c5f8b8d4ae1e04d457d85 # v3.8.1

      # Sign by digest so ALL tags (latest, branch, sha-*) are covered by one signature
      - name: Sign all images by digest
        run: |
          cosign sign --yes ${{ steps.push.outputs.realmd-ref }}
          cosign sign --yes ${{ steps.push.outputs.mangosd-ref }}
          cosign sign --yes ${{ steps.push.outputs.db-ref }}
        env:
          COSIGN_EXPERIMENTAL: true

  scan:
    runs-on: ubuntu-24.04
    needs: publish
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # needed to attach SBOMs to releases
      actions: read

    steps:
      - name: Generate SBOM for realmd
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ needs.publish.outputs.realmd-ref }}
          format: 'spdx-json'
          output: 'sbom-realmd.spdx.json'
          exit-code: '0'

      - name: Generate SBOM for mangosd
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ needs.publish.outputs.mangosd-ref }}
          format: 'spdx-json'
          output: 'sbom-mangosd.spdx.json'
          exit-code: '0'

      - name: Generate SBOM for db
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ needs.publish.outputs.db-ref }}
          format: 'spdx-json'
          output: 'sbom-db.spdx.json'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner on realmd
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ needs.publish.outputs.realmd-ref }}
          format: 'sarif'
          output: 'trivy-realmd.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run Trivy vulnerability scanner on mangosd
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ needs.publish.outputs.mangosd-ref }}
          format: 'sarif'
          output: 'trivy-mangosd.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run Trivy vulnerability scanner on db
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ needs.publish.outputs.db-ref }}
          format: 'sarif'
          output: 'trivy-db.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results for realmd to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab7f2f # v3.29.0
        with:
          sarif_file: 'trivy-realmd.sarif'
          category: 'realmd'

      - name: Upload Trivy results for mangosd to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab7f2f # v3.29.0
        with:
          sarif_file: 'trivy-mangosd.sarif'
          category: 'mangosd'

      - name: Upload Trivy results for db to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab7f2f # v3.29.0
        with:
          sarif_file: 'trivy-db.sarif'
          category: 'db'

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sboms
          path: |
            sbom-realmd.spdx.json
            sbom-mangosd.spdx.json
            sbom-db.spdx.json
          retention-days: 30

      - name: Attach SBOMs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            sbom-realmd.spdx.json
            sbom-mangosd.spdx.json
            sbom-db.spdx.json

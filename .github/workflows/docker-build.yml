name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e6b881e8f30d9f5ceb2c2c7 # v17
        with:
          logger: pretty
          log-directly: true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@ae20d63522b1d92d63c2f0b9df2b6c12dc29d55d # v9

      - name: Build Docker images with Nix
        run: |
          nix build .#realmd-image-tar .#mangosd-image-tar .#db-image-tar

      - name: Load images into Docker
        run: |
          docker load < result-realmd-image-tar
          docker load < result-mangosd-image-tar
          docker load < result-db-image-tar

      - name: Verify images are loaded
        run: |
          docker image inspect tortoise-wow-realmd:latest
          docker image inspect tortoise-wow-mangosd:latest
          docker image inspect tortoise-wow-db:latest

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for realmd
        id: meta-realmd
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a420667bea5 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-realmd
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long

      - name: Extract metadata for mangosd
        id: meta-mangosd
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a420667bea5 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mangosd
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long

      - name: Extract metadata for db
        id: meta-db
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a420667bea5 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-db
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long

      - name: Tag and push realmd
        if: github.event_name != 'pull_request'
        id: push-realmd
        run: |
          for tag in ${{ steps.meta-realmd.outputs.tags }}; do
            docker tag tortoise-wow-realmd:latest $tag
            docker push $tag
            echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' $tag)" >> $GITHUB_OUTPUT
          done

      - name: Tag and push mangosd
        if: github.event_name != 'pull_request'
        id: push-mangosd
        run: |
          for tag in ${{ steps.meta-mangosd.outputs.tags }}; do
            docker tag tortoise-wow-mangosd:latest $tag
            docker push $tag
            echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' $tag)" >> $GITHUB_OUTPUT
          done

      - name: Tag and push db
        if: github.event_name != 'pull_request'
        id: push-db
        run: |
          for tag in ${{ steps.meta-db.outputs.tags }}; do
            docker tag tortoise-wow-db:latest $tag
            docker push $tag
            echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' $tag)" >> $GITHUB_OUTPUT
          done

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c5f8b8d4ae1e04d457d85 # v3.8.1

      - name: Sign realmd image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-realmd:sha-${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: true

      - name: Sign mangosd image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mangosd:sha-${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: true

      - name: Sign db image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-db:sha-${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: true

      - name: Generate SBOM for realmd
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-realmd:sha-${{ github.sha }}
          format: 'spdx-json'
          output: 'sbom-realmd.spdx.json'
          exit-code: '0'

      - name: Generate SBOM for mangosd
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mangosd:sha-${{ github.sha }}
          format: 'spdx-json'
          output: 'sbom-mangosd.spdx.json'
          exit-code: '0'

      - name: Generate SBOM for db
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-db:sha-${{ github.sha }}
          format: 'spdx-json'
          output: 'sbom-db.spdx.json'
          exit-code: '0'

      - name: Attach SBOMs to release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            sbom-realmd.spdx.json
            sbom-mangosd.spdx.json
            sbom-db.spdx.json

      - name: Upload SBOMs as artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sboms
          path: |
            sbom-realmd.spdx.json
            sbom-mangosd.spdx.json
            sbom-db.spdx.json
          retention-days: 30

      - name: Run Trivy vulnerability scanner on realmd
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-realmd:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-realmd.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner on mangosd
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mangosd:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-mangosd.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner on db
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-db:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-db.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab7f2f # v3.29.0
        with:
          sarif_file: 'trivy-realmd.sarif'
          category: 'realmd'

      - name: Upload Trivy scan results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab7f2f # v3.29.0
        with:
          sarif_file: 'trivy-mangosd.sarif'
          category: 'mangosd'

      - name: Upload Trivy scan results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab7f2f # v3.29.0
        with:
          sarif_file: 'trivy-db.sarif'
          category: 'db'
